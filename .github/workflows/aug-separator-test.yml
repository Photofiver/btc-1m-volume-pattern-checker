name: Combined filters 5m validation
on:
  push:
    branches: [tmp-aug-separator-test]
    paths:
      - '.github/workflows/aug-separator-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tmp_aug_test/test_combined_filters_5m.py
      - uses: actions/upload-artifact@v4
        with:
          name: combined-filter-result
          path: tmp_aug_test/combined_filter_result.json
